name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby-version: ['3.1', '3.2', '3.3']

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install missing Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        packages=()
        [[ -f /usr/include/yaml.h ]] || packages+=(libyaml-dev)

        if ! command -v google-chrome >/dev/null 2>&1 && \
           ! command -v google-chrome-stable >/dev/null 2>&1 && \
           ! command -v chromium >/dev/null 2>&1 && \
           ! command -v chromium-browser >/dev/null 2>&1; then
          curl --fail --location --silent --show-error \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            --output /tmp/google-chrome.deb
          packages+=(/tmp/google-chrome.deb)
        fi

        if (( ${#packages[@]} )); then
          sudo apt-get update
          sudo apt-get install --yes "${packages[@]}"
        fi

    - name: Prepare Ruby tool cache on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if [[ ! -w /Users/runner ]]; then
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /Users/runner
        fi

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24

    - name: Run tests
      run: bundle exec rake test
      timeout-minutes: 5

    - name: Upload test artifacts
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: test-artifacts-${{ matrix.os }}-ruby-${{ matrix.ruby-version }}
        path: tmp
